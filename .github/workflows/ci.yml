name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            RAG/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # [dev] 才带 pytest/pytest-asyncio/respx；缺了它 python -m pytest 会 ModuleNotFoundError
          pip install -e './RAG[dev]'

      - name: Run unit tests
        env:
          DEEPSEEK_KEY: ci-placeholder
        run: python -m pytest
